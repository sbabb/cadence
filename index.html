<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- interactive-widget=resizes-content tells Chrome on Android to shrink
         the LAYOUT viewport when the on-screen keyboard appears, instead of
         leaving it full height and sliding the keyboard over the top. Without
         it a `position: fixed; inset: 0` sheet anchors to a viewport that is
         partly behind the keyboard, which is why the spend sheet's SET TOTAL
         and CANCEL buttons had to be dragged into view.

         maximum-scale is deliberately gone: pinch-zoom is an accessibility
         feature and blocking it never fixed anything here. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content" />
    <link rel="icon" href="./icons/icon-48.png" />
    <!-- Installing to a home screen: the manifest names the app and supplies
         the icons, apple-touch-icon covers iOS, which ignores the manifest's.
         Both need the app served over HTTPS (or localhost) to take effect -
         a plain http:// LAN address will not offer a real install. -->
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="apple-touch-icon" href="./icons/icon-180.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Cadence" />
    <!-- Kept in sync with the active theme's --bg at runtime (themes.js). -->
    <meta name="theme-color" content="#1a1b26" />
    <title>Cadence</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./src/main.jsx"></script>
  </body>
</html>
